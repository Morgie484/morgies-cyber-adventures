name: Deploy TRACE to GitHub Pages

# Publishes the trace-forensics-rpg/ subfolder as the GitHub Pages site.
# The game is static (HTML + CSS + ES modules), so no build step is needed —
# we just upload the folder as the Pages artifact.

on:
  push:
    branches:
      - main
      - add-trace-forensics-rpg
    paths:
      - "trace-forensics-rpg/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the game folder as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: trace-forensics-rpg

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
